# Push a tag like v1.2.0 and this attaches a ready-to-run event kit
# (neutral "example" college) to a GitHub Release. Colleges that don't code
# download it, unzip it, and change their name and departments in the
# host console's College tab.
name: Release event kit
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  kit:
    runs-on: ubuntu-latest
    env:
      COLLEGE: example
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm kit
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/event-kit-example.zip
          generate_release_notes: true
